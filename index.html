<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Products</title>
  <style>
    :root{--bg:#0b0b0f;--card:#12121a;--b:#2a2a33;--t:#fff;--m:rgba(255,255,255,.72)}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--t)}
    .wrap{max-width:1120px;margin:0 auto;padding:18px 16px 26px}

    /* TOP PROMO BANNER */
    .banner{
      background:#ff7a00;
      color:#111;
      border-radius:18px;
      padding:12px 14px;
      font-weight:900;
      letter-spacing:.2px;
      margin:10px 0 14px;
      display:flex;
      justify-content:center;
      text-align:center;
    }
    .banner span{opacity:.9;font-weight:800}

    .head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
    h1{margin:0 0 6px;font-size:28px}
    p{margin:0;color:var(--m)}
    .search{
      margin-top:2px;padding:12px 14px;border-radius:14px;border:1px solid var(--b);
      background:var(--card);color:var(--t);font-size:15px;min-width:260px;flex:0 0 auto;
    }

    /* BIGGER TABS */
    .tabs{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 18px}
    .tab{
      font-size:14px;
      color:var(--m);
      border:1px solid var(--b);
      padding:9px 14px;
      border-radius:999px;
      cursor:pointer;
      user-select:none;
      line-height:1;
    }
    .tab.active{color:var(--t);border-color:#6a6a7a}

    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    @media (min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
    @media (min-width:1020px){.grid{grid-template-columns:repeat(4,1fr)}}

    .card{position:relative;border:1px solid var(--b);border-radius:18px;background:var(--card);overflow:hidden;display:flex;flex-direction:column}
    .img{aspect-ratio:1/1;background:#0f0f14;display:flex;align-items:center;justify-content:center}
    .img img{width:100%;height:100%;object-fit:cover;display:block}
    .noimg{color:rgba(255,255,255,.35);font-size:12px}
    .c{padding:12px}
    .name{font-weight:800;font-size:14.5px;line-height:1.2;margin:0 0 10px}
    .price{text-align:center;font-weight:900;font-size:18px;letter-spacing:.2px;margin:6px 0 10px}
    .meta{display:flex;justify-content:space-between;color:var(--m);font-size:12px}
    a.btn{margin-top:10px;display:block;text-align:center;text-decoration:none;color:var(--t);border:1px solid var(--b);padding:10px 12px;border-radius:14px}
    a.btn:hover{border-color:#6a6a7a}
    .empty{color:var(--m);padding:18px;border:1px dashed var(--b);border-radius:18px}

    /* FAVORITE BUTTON */
    .fav{
      position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:999px;
      border:1px solid var(--b);background:rgba(18,18,26,.88);
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;user-select:none;z-index:5;
    }
    .fav:hover{border-color:#6a6a7a}
    .fav span{font-size:18px;line-height:1}
  </style>
</head>
<body>

    <div id="tabs" class="tabs"></div>
    <div id="grid" class="grid"></div>

    // ---- ACCESSORIES ----
    { name:"Calvin Klein Boxers (3 Pairs)", category:"accessories", price:"$13.35", img:"images/calvin-klein-boxers.png", itaobuy:"https://itaobuy.allapp.link/d5sk7r8a0mjgn6qs1140" },

    { name:"Lacoste Bracelet", category:"accessories", price:"$23.39", img:"images/lacoste-bracelet.png", itaobuy:"https://itaobuy.allapp.link/d5skb981bc5jk0bvojl0" },

    { name:"Louis Vuitton Belts (30+ Styles)", category:"accessories", price:"$11.78", img:"images/louis-vuitton-belts.png", itaobuy:"https://itaobuy.allapp.link/d5snciggpf6jjq8mqnr0" },
    { name:"Elite Backpack (25+ Styles)", category:"accessories", price:"$15.70", img:"images/elite-backpack.png", itaobuy:"https://itaobuy.allapp.link/d5snddga0mjgn6s56g80" },
    { name:"Supreme Boxers", category:"accessories", price:"$3.92", img:"images/supreme-boxers.png", itaobuy:"https://itaobuy.allapp.link/d5sndtda5kl0ibqhrum0" },
    { name:"Goyard Wallets (30+ Styles)", category:"accessories", price:"$12.40", img:"images/goyard-wallets.png", itaobuy:"https://itaobuy.allapp.link/d5sng78a0mjgn6s68n8g" },
  ];

  // ---------- FAVORITES ----------
  const FAV_KEY = "itaofits_favs_v3";
  function getFavArray(){
    try {
      const raw = localStorage.getItem(FAV_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    } catch { return []; }
  }
  function setFavArray(arr){ localStorage.setItem(FAV_KEY, JSON.stringify(arr)); }
  function isFav(id){ return getFavArray().includes(id); }
  function toggleFav(id){
    const arr = getFavArray();
    const i = arr.indexOf(id);
    if(i >= 0) arr.splice(i, 1); else arr.push(id);
    setFavArray(arr);
  }

  const tabsEl = document.getElementById("tabs");
  const gridEl = document.getElementById("grid");
  const searchEl = document.getElementById("search");

  const qs = new URLSearchParams(location.search);
  let activeCat = (qs.get("category") || "all").toLowerCase();

  function setUrlCategory(c){
    const url = new URL(location.href);
    if(!c || c==="all") url.searchParams.delete("category");
    else url.searchParams.set("category", c);
    history.replaceState({}, "", url);
  }

  function cats(){
    const set = new Set(PRODUCTS.map(p => (p.category || "other").toLowerCase()));
    const list = Array.from(set).sort();
    return ["all", "favorites", ...list];
  }

  function labelCat(c){
    if(c==="all") return "All";
    if(c==="favorites") return "Favorites";
    if(c==="t-shirts") return "T-Shirts";
    return c.charAt(0).toUpperCase() + c.slice(1);
  }

  function renderTabs(){
    const list = cats();
    if(!list.includes(activeCat)) activeCat = "all";
    tabsEl.innerHTML = list.map(c =>
      `<div class="tab ${c===activeCat ? "active":""}" data-cat="${c}">${labelCat(c)}</div>`
    ).join("");
    tabsEl.querySelectorAll(".tab").forEach(t => {
      t.addEventListener("click", () => {
        activeCat = t.dataset.cat;
        setUrlCategory(activeCat);
        render();
      });
    });
  }

  function card(p){
    const img = p.img
      ? `<img src="${p.img}" alt="${p.name}" loading="lazy">`
      : `<div class="noimg">No image</div>`;

    const heart = isFav(p.itaobuy) ? "❤️" : "🤍";

    return `
      <div class="card" data-href="${p.itaobuy}">
        <div class="fav" data-fav="${p.itaobuy}" aria-label="Favorite"><span>${heart}</span></div>
        <div class="img">${img}</div>
        <div class="c">
          <div class="name">${p.name}</div>
          <div class="price">${p.price}</div>
          <div class="meta">
            <span>${labelCat(p.category)}</span>
            <span>Open in Itaobuy</span>
          </div>
          <a class="btn" href="${p.itaobuy}" target="_blank" rel="noopener">Open</a>
        </div>
      </div>
    `;
  }

  function render(){
    tabsEl.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.cat === activeCat));
    const q = (searchEl.value || "").toLowerCase().trim();

    let list = PRODUCTS;

    if(activeCat === "favorites"){
      const favs = getFavArray();
      list = PRODUCTS.filter(p => favs.includes(p.itaobuy));
    } else if(activeCat !== "all"){
      list = PRODUCTS.filter(p => (p.category||"other").toLowerCase() === activeCat);
    }

    list = list.filter(p => {
      const hay = (p.name + " " + p.category + " " + p.price).toLowerCase();
      return !q || hay.includes(q);
    });

    gridEl.innerHTML = list.length ? list.map(card).join("") : `<div class="empty">No results.</div>`;

    // Favorite click
    gridEl.querySelectorAll(".fav").forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        e.stopPropagation();
        toggleFav(btn.getAttribute("data-fav"));
        render();
      });
    });

    // Card click => open link (except on <a> or favorite)
    gridEl.querySelectorAll(".card").forEach(c => {
      const href = c.getAttribute("data-href");
      c.addEventListener("click", (e) => {
        if(e.target.tagName === "A") return;
        if(e.target.closest && e.target.closest(".fav")) return;
        window.open(href, "_blank", "noopener");
      });
    });
  }

  searchEl.addEventListener("input", render);

  renderTabs();
  render();
</script>
</body>
</html>
