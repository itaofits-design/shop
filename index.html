<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Products</title>
  <style>
    :root{--bg:#0b0b0f;--card:#12121a;--b:#2a2a33;--t:#fff;--m:rgba(255,255,255,.72)}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--t)}
    .wrap{max-width:1120px;margin:0 auto;padding:26px 16px}
    .head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
    h1{margin:0 0 6px;font-size:28px}
    p{margin:0;color:var(--m)}
    .search{
      margin-top:2px;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid var(--b);
      background:var(--card);
      color:var(--t);
      font-size:15px;
      min-width:260px;
      flex:0 0 auto;
    }
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 16px}
    .tab{font-size:13px;color:var(--m);border:1px solid var(--b);padding:7px 12px;border-radius:999px;cursor:pointer;user-select:none}
    .tab.active{color:var(--t);border-color:#6a6a7a}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    @media (min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}}
    @media (min-width:1020px){.grid{grid-template-columns:repeat(4,1fr)}}
    .card{border:1px solid var(--b);border-radius:18px;background:var(--card);overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
    .img{aspect-ratio:1/1;background:#0f0f14;display:flex;align-items:center;justify-content:center}
    .img img{width:100%;height:100%;object-fit:cover;display:block}
    .noimg{color:rgba(255,255,255,.35);font-size:12px}
    .c{padding:12px}
    .name{font-weight:800;font-size:14.5px;line-height:1.2;margin:0 0 10px}
    /* PRICE: centered + emphasized */
    .price{
      text-align:center;
      font-weight:900;
      font-size:18px;
      letter-spacing:.2px;
      margin:6px 0 10px;
    }
    .meta{display:flex;justify-content:space-between;color:var(--m);font-size:12px}
    a.btn{margin-top:10px;display:block;text-align:center;text-decoration:none;color:var(--t);border:1px solid var(--b);padding:10px 12px;border-radius:14px}
    a.btn:hover{border-color:#6a6a7a}
    .empty{color:var(--m);padding:18px;border:1px dashed var(--b);border-radius:18px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div>
        <h1>Products</h1>
        <p>Click any item to open the Itaobuy link.</p>
      </div>
      <input id="search" class="search" placeholder="Search (e.g., Yeezy, T-Shirt, Bracelet)..." />
    </div>

    <div id="tabs" class="tabs"></div>
    <div id="grid" class="grid"></div>
  </div>

<script>
  // Edit only this list when adding products.
  const PRODUCTS = [{ name:"New Item", category:"t-shirts", price:"$12.34", img:"images/new-item.png", itaobuy:"https://..." },

    // ---- SHOES ----
    { name:"Dior B30", category:"shoes", price:"$28.26", img:"images/dior-b30.png", itaobuy:"https://itaobuy.allapp.link/d5si1uggpf6jjqejpi60" },
    { name:"Dior B22", category:"shoes", price:"$28.26", img:"images/dior-b22.png", itaobuy:"https://itaobuy.allapp.link/d5si2bggpf6jjqejuhrg" },
    { name:"Air Max TN (22 Styles)", category:"shoes", price:"$23.55", img:"images/airmax.png", itaobuy:"https://itaobuy.allapp.link/d5si2m8a0mjgn6q21uhg" },
    { name:"Jordan 4 (25 Colors)", category:"shoes", price:"$45.53", img:"images/jordan4.png", itaobuy:"https://itaobuy.allapp.link/d5si3qla5kl0iboeuvng" },
    { name:"Yeezy 350", category:"shoes", price:"$28.26", img:"images/yeezy-350.png", itaobuy:"https://itaobuy.allapp.link/d5sk1a7qcfqhuovjqkpg" },

    // ---- T-SHIRTS ----
    { name:"Moncler T-Shirt", category:"t-shirts", price:"$10.83", img:"images/moncler-t-shirt.png", itaobuy:"https://itaobuy.allapp.link/d5sk1ohqljok535cpse0" },
    { name:"Ralph Lauren T-Shirt", category:"t-shirts", price:"$10.68", img:"images/ralph-lauren-t-shirt.png", itaobuy:"https://itaobuy.allapp.link/d5sk2601bc5jk0bs94rg" },
    { name:"Stussy T-Shirt (35+ Styles)", category:"t-shirts", price:"$10.83", img:"images/stussy-t-shirt.png", itaobuy:"https://itaobuy.allapp.link/d5sk50nqcfqhuovl43e0" },
    { name:"Lacoste T-Shirt", category:"t-shirts", price:"$10.68", img:"images/lacoste-t-shirt.png", itaobuy:"https://itaobuy.allapp.link/d5sk3apqljok535dbhn0" },
    { name:"Stone Island T-Shirt", category:"t-shirts", price:"$15.54", img:"images/stone-island-t-shirt.png", itaobuy:"https://itaobuy.allapp.link/d5sk4q7qcfqhuovl1r50" },

    // ---- HOODIES ----
    { name:"Burberry Zip Up (30+ Styles)", category:"hoodies", price:"$26.38", img:"images/burberry-zip-up.png", itaobuy:"https://itaobuy.allapp.link/d5sk4j1qljok535dph10" },
    { name:"Louis Vuitton Sweater", category:"hoodies", price:"$42.39", img:"images/louis-vuitton-sweater.png", itaobuy:"https://itaobuy.allapp.link/d5sk5ifqcfqhuovla4j0" },
    { name:"Stone Island Hoodie", category:"hoodies", price:"$28.26", img:"images/stone-island-hoodie.png", itaobuy:"https://itaobuy.allapp.link/d5sk5v81bc5jk0btjdmg" },
    { name:"Ralph Lauren Quarter Zip (9+ Styles)", category:"hoodies", price:"$34.53", img:"images/ralph-lauren-quarter-zip.png", itaobuy:"https://itaobuy.allapp.link/d5sk6no1bc5jk0bts0h0" },
    { name:"Ralph Lauren Zip Up", category:"hoodies", price:"$22.61", img:"images/ralph-lauren-zip-up.png", itaobuy:"https://itaobuy.allapp.link/d5sk775a5kl0ibp8930g" },

    // ---- ACCESSORIES ----
    { name:"Calvin Klein Boxers (3 Pairs)", category:"accessories", price:"$13.35", img:"images/calvin-klein-boxers.png", itaobuy:"https://itaobuy.allapp.link/d5sk7r8a0mjgn6qs1140" },
    { name:"Chrome Hearts Glasses", category:"accessories", price:"$1.73", img:"images/chrome-hearts-glasses.png", itaobuy:"https://itaobuy.allapp.link/d5ska58gpf6jjqff0t90" },
    { name:"Nike Socks (20+ Colors)", category:"accessories", price:"$9.11", img:"images/nike-socks.png", itaobuy:"https://itaobuy.allapp.link/d5skai7qcfqhuovn9ve0" },
    { name:"Van Cleef Bracelet", category:"accessories", price:"$28.26", img:"images/van-cleef-bracelet.png", itaobuy:"https://itaobuy.allapp.link/d5skavggpf6jjqffc6ng" },
    { name:"Lacoste Bracelet", category:"accessories", price:"$23.39", img:"images/lacoste-bracelet.png", itaobuy:"https://itaobuy.allapp.link/d5skb981bc5jk0bvojl0" },
  ];

  const tabsEl = document.getElementById("tabs");
  const gridEl = document.getElementById("grid");
  const searchEl = document.getElementById("search");

  // URL category support: ?category=shoes
  const qs = new URLSearchParams(location.search);
  let activeCat = (qs.get("category") || "all").toLowerCase();

  function setUrlCategory(c){
    const url = new URL(location.href);
    if(!c || c==="all") url.searchParams.delete("category");
    else url.searchParams.set("category", c);
    history.replaceState({}, "", url);
  }

  function uniqCats(){
    const set = new Set(PRODUCTS.map(p => (p.category || "other").toLowerCase()));
    return ["all", ...Array.from(set).sort()];
  }

  function labelCat(c){
    if(c==="all") return "All";
    if(c==="t-shirts") return "T-Shirts";
    return c.charAt(0).toUpperCase() + c.slice(1);
  }

  function renderTabs(){
    const cats = uniqCats();
    if(!cats.includes(activeCat)) activeCat = "all";
    tabsEl.innerHTML = cats.map(c => `<div class="tab ${c===activeCat?"active":""}" data-cat="${c}">${labelCat(c)}</div>`).join("");
    tabsEl.querySelectorAll(".tab").forEach(t => {
      t.onclick = () => { activeCat = t.dataset.cat; setUrlCategory(activeCat); render(); };
    });
  }

  function card(p){
    const img = p.img
      ? `<img src="${p.img}" alt="${p.name}" loading="lazy">`
      : `<div class="noimg">No image</div>`;

    return `
      <div class="card" data-href="${p.itaobuy}">
        <div class="img">${img}</div>
        <div class="c">
          <div class="name">${p.name}</div>
          <div class="price">${p.price}</div>
          <div class="meta">
            <span>${labelCat(p.category)}</span>
            <span>Open in Itaobuy</span>
          </div>
          <a class="btn" href="${p.itaobuy}" target="_blank" rel="noopener">Open</a>
        </div>
      </div>
    `;
  }

  function render(){
    tabsEl.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.cat === activeCat));
    const q = (searchEl.value || "").toLowerCase().trim();

    const filtered = PRODUCTS.filter(p => {
      const cat = (p.category||"other").toLowerCase();
      const matchCat = (activeCat==="all") || (cat===activeCat);
      const hay = (p.name + " " + cat + " " + (p.price||"")).toLowerCase();
      const matchQ = !q || hay.includes(q);
      return matchCat && matchQ;
    });

    gridEl.innerHTML = filtered.length ? filtered.map(card).join("") : `<div class="empty">No results.</div>`;

    gridEl.querySelectorAll(".card").forEach(c => {
      const href = c.dataset.href;
      c.onclick = (e) => {
        if(e.target.tagName === "A") return;
        window.open(href, "_blank", "noopener");
      };
    });
  }

  searchEl.addEventListener("input", render);

  renderTabs();
  render();
</script>
</body>
</html>
