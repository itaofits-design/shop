<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Curated Products</title>
  <style>
    :root{--bg:#0b0b0f;--card:#12121a;--b:#2a2a33;--t:#ffffff;--muted:rgba(255,255,255,.7)}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--t)}
    .wrap{max-width:1100px;margin:0 auto;padding:28px 16px}
    h1{margin:0 0 6px;font-size:28px}
    p{margin:0 0 16px;color:var(--muted)}
    .top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 18px}
    input,select{padding:12px 14px;border-radius:14px;border:1px solid var(--b);background:var(--card);color:var(--t);font-size:16px}
    input{flex:1;min-width:220px}
    select{min-width:180px}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    @media (min-width:720px){.grid{grid-template-columns:repeat(3,1fr)}}
    @media (min-width:980px){.grid{grid-template-columns:repeat(4,1fr)}}
    .card{border:1px solid var(--b);border-radius:18px;background:var(--card);overflow:hidden;display:flex;flex-direction:column}
    .img{aspect-ratio:1/1;background:#0f0f14;display:flex;align-items:center;justify-content:center}
    .img img{width:100%;height:100%;object-fit:cover;display:block}
    .c{padding:12px}
    .name{font-weight:800;font-size:14.5px;line-height:1.2;margin:0 0 6px}
    .meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px}
    a.btn{margin-top:10px;display:inline-block;text-decoration:none;color:var(--t);border:1px solid var(--b);padding:10px 12px;border-radius:14px}
    a.btn:hover{border-color:#6a6a7a}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
    .chip{font-size:12px;color:var(--muted);border:1px solid var(--b);padding:6px 10px;border-radius:999px;cursor:pointer;user-select:none}
    .chip.active{color:var(--t);border-color:#6a6a7a}
    .empty{color:var(--muted);padding:18px;border:1px dashed var(--b);border-radius:18px}
    footer{margin-top:24px;color:var(--muted);font-size:12px}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Curated Products</h1>
    <p>Válogatott linkek egy helyen.</p>

    <div class="top">
      <input id="q" placeholder="Keresés (pl. kabát / cipő / márka)..." />
      <select id="cat"></select>
    </div>

    <div id="chips" class="chips"></div>
    <div id="grid" class="grid"></div>

    <footer>
      Tipp: Kategória linkelés így: <code>?category=pants</code>
    </footer>
  </div>

<script>
  // 1) ITT ADD HOZZÁ A TERMÉKEIDET
  // - img lehet üres is ("") akkor nem jelenít képet.
  const PRODUCTS = [
    { name:"Dior B30 (30-Styles)", category:"shoes", price:"", link:"https://litbuy.com/...", img:"" },
    { name:"Jordan 4 (20-Styles)", category:"shoes", price:"", link:"https://litbuy.com/...", img:"" },
    { name:"Pants bundle", category:"pants", price:"", link:"https://litbuy.com/...", img:"" },
  ];

  const qs = new URLSearchParams(location.search);
  const initialCat = (qs.get("category") || "all").toLowerCase();

  const grid = document.getElementById("grid");
  const qInput = document.getElementById("q");
  const catSel = document.getElementById("cat");
  const chipsEl = document.getElementById("chips");

  function uniqCats(){
    const set = new Set(PRODUCTS.map(p => (p.category||"other").toLowerCase()));
    return ["all", ...Array.from(set).sort()];
  }

  function niceCat(c){
    if(c==="all") return "All Products";
    return c.charAt(0).toUpperCase() + c.slice(1);
  }

  function setUrlCategory(c){
    const url = new URL(location.href);
    if(!c || c==="all") url.searchParams.delete("category");
    else url.searchParams.set("category", c);
    history.replaceState({}, "", url);
  }

  function renderCats(){
    const cats = uniqCats();
    catSel.innerHTML = cats.map(c => `<option value="${c}">${niceCat(c)}</option>`).join("");
    catSel.value = cats.includes(initialCat) ? initialCat : "all";

    chipsEl.innerHTML = cats.map(c => `
      <div class="chip ${catSel.value===c ? "active":""}" data-cat="${c}">${niceCat(c)}</div>
    `).join("");

    chipsEl.querySelectorAll(".chip").forEach(ch => {
      ch.addEventListener("click", () => {
        catSel.value = ch.dataset.cat;
        setUrlCategory(catSel.value);
        render();
      });
    });
  }

  function card(p){
    const img = p.img ? `<img src="${p.img}" alt="">` : `<div style="color:rgba(255,255,255,.35);font-size:12px">No image</div>`;
    const price = p.price ? p.price : "";
    return `
      <div class="card">
        <div class="img">${img}</div>
        <div class="c">
          <div class="name">${escapeHtml(p.name)}</div>
          <div class="meta">
            <span>${escapeHtml((p.category||"other").toLowerCase())}</span>
            <span>${escapeHtml(price)}</span>
          </div>
          <a class="btn" href="${p.link}" target="_blank" rel="noopener">Open</a>
        </div>
      </div>
    `;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  }

  function render(){
    const q = (qInput.value || "").toLowerCase().trim();
    const cat = (catSel.value || "all").toLowerCase();

    // update chips active state
    chipsEl.querySelectorAll(".chip").forEach(ch => ch.classList.toggle("active", ch.dataset.cat === cat));

    const filtered = PRODUCTS.filter(p => {
      const pc = (p.category||"other").toLowerCase();
      const matchCat = (cat==="all") || (pc===cat);
      const hay = (p.name + " " + pc + " " + (p.price||"") + " " + p.link).toLowerCase();
      const matchQ = !q || hay.includes(q);
      return matchCat && matchQ;
    });

    grid.innerHTML = filtered.length
      ? filtered.map(card).join("")
      : `<div class="empty">Nincs találat.</div>`;
  }

  qInput.addEventListener("input", render);
  catSel.addEventListener("change", () => { setUrlCategory(catSel.value); render(); });

  renderCats();
  render();
</script>
</body>
</html>
